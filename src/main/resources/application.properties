spring.application.name=Na7ki
spring.config.import=optional:file:.env.properties

server.port=8081

# Jackson serialization
# spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.date-format=dd-MM-yyyy
spring.jackson.deserialization.fail-on-unknown-properties=false

# --- MySQL Database Configuration ---
# The URL tells it to connect to localhost port 3306, and create a database named 'na7ki' if it doesn't exist
spring.datasource.url=jdbc:mysql://localhost:3306/na7ki?createDatabaseIfNotExist=true
spring.datasource.username=root

# REPLACE THIS with the root password you just set during installation!
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Tells Hibernate to automatically create or update your database tables based on your Java entities
spring.jpa.hibernate.ddl-auto=update
# Shows the SQL queries in your console (helpful for debugging)
spring.jpa.show-sql=true

