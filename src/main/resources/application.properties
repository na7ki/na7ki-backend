#=============== CONFIGURATION IMPORTING ==============
spring.profiles.active=local

#================ LOGGING =========================
spring.jpa.show-sql=true

#============= DEPLOYMENT =================
server.port=8081

#================ GENERAL ================
spring.application.name=Na7ki

#============= INITIALIZATION ==================
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

#============= JACKSON SERIALIZATION ================
spring.jackson.date-format=dd-MM-yyyy
spring.jackson.deserialization.fail-on-unknown-properties=false

#================ JWT ========================
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

#========== VERIFICATION CODE EXPIRATION DURATIONS (in minutes) ===================
vc.expiration.basic=3
vc.expiration.additional=5

#============= MySQL DATABASE ==========================
# connection
spring.datasource.url=jdbc:mysql://localhost:3306/${db.name}?createDatabaseIfNotExist=true
spring.datasource.username=${db.username:root}
spring.datasource.password=${DB_PASSWORD}

# schema
spring.jpa.hibernate.ddl-auto=update

#=========== CLOUD STORAGE (Cloudinary) ==================
cloudinary.cloud-name=dl24wsi47
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

#=================== EMAIL =========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
