spring.application.name=Na7ki

server.port=8081

# initial security credentials to be changed
spring.security.user.name=user
spring.security.user.password=123

# jwt
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# Database connection
spring.datasource.url=jdbc:mysql://localhost:3306/na7ki
spring.datasource.username=na7ki_user
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update